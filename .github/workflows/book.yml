name: Book

# Builds the book on every push and pull request, deploys it to GitHub Pages from main,
# and once a week (or on demand) builds it against Nanuq's main branch to catch API
# changes early. Rust is never built here: config.nims compiles with
# -d:nanuqLib=prebuilt, so the build fails unless Nanuq's lib version is released
# (lib-v<version> on GitHub). The weekly build against main fails while main is on a
# -dev lib version.
# Builds are incremental: a chapter reruns only when a file it depends on changed (its
# record is in its JSON on the live site); see bookbuild.nim.
on:
  push:
    branches: [main]
    # files no chapter reads (Markdown chapters live in book/, so not **.md)
    paths-ignore:
      - README.md
      - LICENSE
      - licenses/**
      - scripts/**
      - .gitignore
      - .claude/**
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - licenses/**
      - scripts/**
      - .gitignore
      - .claude/**
  schedule:
    - cron: "0 6 * * 1"  # Mondays
  workflow_dispatch:
    inputs:
      nanuq-main:
        description: "Build against Nanuq's main branch instead of the pinned commit"
        type: boolean
        default: false
      force:
        description: "Rerun every chapter, even the ones whose inputs did not change"
        type: boolean
        default: false

# A new push to a pull request cancels the run of the previous one; main runs one at a time.
concurrency:
  group: book-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04  # still ships libpcre3, which nimib's markdown renderer needs
    env:
      NANUQ_MAIN: ${{ github.event_name == 'schedule' || inputs.nanuq-main == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use Nanuq's main branch
        if: env.NANUQ_MAIN == 'true'
        run: git -C nanuq fetch --depth 1 origin main && git -C nanuq checkout FETCH_HEAD
      - run: git -C nanuq log --oneline -1
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # libpcre3 for nimib; strace for bookbuild.nim, which records the files each chapter
      # reads. The runner's package index usually has both; refresh it only if not.
      - run: sudo apt-get install -y --no-install-recommends libpcre3 strace || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcre3 strace)
      # Nim packages: restored from the cache when nanuqbook.nimble is unchanged
      - uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-2.2.4-${{ hashFiles('nanuqbook.nimble') }}
      - run: nimble install -y --depsOnly
      # Nanuq's prebuilt lib (~/.cache/nanuq/<version>): its version and checksums are in
      # the submodule, so the key follows the Nanuq commit in use (also for the main build)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nanuq
          key: nanuq-lib-${{ hashFiles('nanuq/src/nanuq/lib-sums.txt', 'nanuq/src/rust/Cargo.toml') }}
      # The Python side of the tabs runs the original Polars code (pyproject.toml, uv.lock)
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Starts from the chapter JSON of the live book and reruns only the chapters whose
      # inputs changed (bookbuild.nim); every page is then rendered from the JSON.
      # A manual run can rerun them all.
      - run: uv run nimble genbook
        env:
          BOOK_FROM: https://pietroppeter.github.io/nanuq-book
          BOOK_FORCE: ${{ inputs.force == true }}
      # nimibook writes a .log next to a chapter that failed to build
      - name: Check that every chapter built
        run: |
          logs=$(find book -name '*.log')
          if [ -n "$logs" ]; then
            for f in $logs; do echo "::error file=${f%.log}.nim::chapter failed to build"; cat "$f"; done
            exit 1
          fi
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
